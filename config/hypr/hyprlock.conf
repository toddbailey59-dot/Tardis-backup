general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
    no_fade_in = false
}

background {
    monitor = DP-3
    path = /home/doctor/Pictures/wallpapers/pairs/space-rosette/left.jpg
    blur_passes = 4
    blur_size = 3
    brightness = 0.4
    contrast = 1.0
}
background {
    monitor = HDMI-A-1
    path = /home/doctor/Pictures/wallpapers/pairs/space-rosette/right.jpg
    blur_passes = 4
    blur_size = 3
    brightness = 0.4
    contrast = 1.0
}

input-field {
    monitor =
    size = 120, 16
    position = 0, -7%
    outline_thickness = 3
    outer_color = rgba(e5b64ccc)
    inner_color = rgba(0a1424ff)
    font_color = rgba(efe5c6ff)
    placeholder_text = <span>Password…</span>
    dots_spacing = 0.3
    rounding = 12
}

label {
    monitor =
    text = System Locked
    font_family = JetBrains Mono
    font_size = 34
    color = rgba(efe5c6ff)
    position = 0, 32%
    halign = center
    valign = center
    shadow_passes = 2
}

