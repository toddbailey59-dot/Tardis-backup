font_family JetBrains Mono
font_size 11.0
adjust_line_height 0%

background_opacity 0.75
background_blur 12
# Announce when long task completed
 notify_on_cmd_finish invisible 10.0 command notify-send "job finished with status: %s" %c

# ============================================================================
# CURSOR SETTINGS
# ============================================================================
# Number of past cursor positions to trail (visual effect)
cursor_trail 3

# How quickly cursor trail fades (start_opacity end_opacity)
cursor_trail_decay 0.1 0.4

cursor_blink_interval 0.5
cursor_stop_blinking_after 4.0

window_padding_width 12
window_border_width 1px

foreground #efe5c6
background #0a1424
selection_background #22558f
selection_foreground #efe5c6

# 4th Doctor scarf ink
color0 #0a1424
color1 #c0392b
color2 #3e7c4f
color3 #e5b64c
color4 #22558f
color5 #5c1f2f
color6 #2e6f6f
color7 #efe5c6
color8 #4a5874
color9 #d2543f
color10 #5a9a6f
color11 #f2cf7a
color12 #5a8fc9
color13 #8a4a5f
color14 #54a8a8
color15 #ffffff

active_tab_foreground #0a1424
active_tab_background #e5b64c
inactive_tab_foreground #9aa8c0
inactive_tab_background #123a6b
tab_bar_style fade

allow_remote_control yes

shell_integration enabled
copy_on_select clipboard

# row 1: kitty modifier: disable all, use SUPER instead
map super+enter new_window_with_cwd
map super+shift+enter new_os_window
map super+c copy_to_clipboard
map super+v paste_from_clipboard

# Plain Ctrl+C copies a selection; with no selection it still interrupts.
map ctrl+c copy_and_clear_or_interrupt
# Plain Ctrl+V pastes from the clipboard.
map ctrl+v paste_from_clipboard
map super+t new_tab
map super+q close_window
map super+1 goto_tab 1
map super+2 goto_tab 2
map super+3 goto_tab 3
map super+4 goto_tab 4
map super+s toggle_layout stack